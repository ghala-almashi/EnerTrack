<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | EnerTrack</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #F4F4FA;
            --card-bg: #FFFFFF;
            --primary: #7C6EF2;
            --primary-dark: #5B4FE8;
            --text: #17172E;
            --muted: #8A8AA3;
            --border: rgba(23, 23, 46, 0.10);
            --danger: #EF5354;
            --success: #2ECC8F;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(124, 110, 242, 0.13),
                    transparent 35%
                ),
                var(--bg);
            color: var(--text);
            font-family: 'Tajawal', sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-name {
            margin: 0;
            font-size: 30px;
            font-weight: 800;
            color: var(--primary-dark);
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 34px;
            box-shadow: 0 12px 35px rgba(30, 30, 70, 0.08);
        }

        .login-title {
            margin: 0;
            text-align: center;
            font-size: 25px;
            font-weight: 800;
        }

        .login-description {
            margin: 8px 0 28px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }

        form p {
            margin: 0 0 18px;
        }

        form label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-size: 14px;
            font-weight: 700;
        }

        form input {
            width: 100%;
            height: 48px;
            padding: 0 14px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: #FAFAFD;
            color: var(--text);

            font-family: 'Tajawal', sans-serif;
            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        form input:focus {
            background: #FFFFFF;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(124, 110, 242, 0.12);
        }

        form ul.errorlist {
            list-style: none;
            padding: 0;
            margin: 6px 0 0;

            color: var(--danger);
            font-size: 12px;
        }

        .error-message {
            margin: 0 0 18px;
            padding: 11px 13px;

            border-radius: 10px;

            background: rgba(239, 83, 84, 0.08);
            color: var(--danger);

            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }

        .login-button {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                var(--primary),
                var(--primary-dark)
            );

            color: #FFFFFF;

            font-family: 'Tajawal', sans-serif;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            box-shadow: 0 8px 18px rgba(90, 70, 220, 0.24);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 11px 22px rgba(90, 70, 220, 0.30);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .forgot-password {
            display: block;
            margin-top: 16px;

            text-align: center;

            color: var(--primary-dark);
            text-decoration: none;

            font-size: 13px;
            font-weight: 600;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .signup-text {
            margin: 24px 0 0;
            padding-top: 20px;

            border-top: 1px solid var(--border);

            text-align: center;

            color: var(--muted);
            font-size: 13px;
        }

        .signup-text a {
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: 700;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-card {
                padding: 25px 20px;
                border-radius: 18px;
            }

            .brand-name {
                font-size: 27px;
            }

            .login-title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="brand">
            <h1 class="brand-name">EnerTrack</h1>
            <p class="brand-subtitle">نظام مراقبة الطاقة</p>
        </div>

        <section class="login-card">

            <h2 class="login-title">تسجيل الدخول</h2>

            <p class="login-description">
                أهلاً بك مجددًا، سجّل الدخول للوصول إلى لوحة التحكم.
            </p>

            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="login-button">
                    تسجيل الدخول
                </button>
            </form>

            <a href="{% url 'forgot_password' %}" class="forgot-password">
                نسيت كلمة المرور؟
            </a>

            <p class="signup-text">
                ليس لديك حساب؟
                <a href="{% url 'signup' %}">إنشاء حساب جديد</a>
            </p>

        </section>

    </main>

</body>
</html>
