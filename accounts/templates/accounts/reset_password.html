<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إعادة تعيين كلمة المرور | EnerTrack</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #F4F4FA;
            --card-bg: #FFFFFF;
            --primary: #7C6EF2;
            --primary-dark: #5B4FE8;
            --text: #17172E;
            --muted: #8A8AA3;
            --border: rgba(23, 23, 46, 0.10);
            --danger: #EF5354;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(124, 110, 242, 0.13),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);
            font-family: 'Tajawal', sans-serif;
        }

        .page-container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-name {
            margin: 0;
            font-size: 30px;
            font-weight: 800;
            color: var(--primary-dark);
        }

        .brand-subtitle {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 34px;

            box-shadow: 0 12px 35px rgba(30, 30, 70, 0.08);
        }

        .icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: rgba(124, 110, 242, 0.10);
            color: var(--primary-dark);

            font-size: 25px;
        }

        h1 {
            margin: 0;
            text-align: center;

            font-size: 24px;
            font-weight: 800;
        }

        .description {
            margin: 9px 0 26px;

            color: var(--muted);
            font-size: 14px;
            line-height: 1.8;

            text-align: center;
        }

        form p {
            margin: 0 0 18px;
        }

        form label {
            display: block;
            margin-bottom: 8px;

            font-size: 14px;
            font-weight: 700;
        }

        form input {
            width: 100%;
            height: 48px;
            padding: 0 14px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: #FAFAFD;
            color: var(--text);

            font-family: 'Tajawal', sans-serif;
            font-size: 14px;

            outline: none;
        }

        form input:focus {
            background: #FFFFFF;
            border-color: var(--primary);

            box-shadow: 0 0 0 4px rgba(124, 110, 242, 0.12);
        }

        form ul.errorlist {
            list-style: none;
            padding: 0;
            margin: 6px 0 0;

            color: var(--danger);
            font-size: 12px;
        }

        .invalid-message {
            padding: 16px;

            border-radius: 12px;

            background: rgba(239, 83, 84, 0.08);
            color: var(--danger);

            font-size: 14px;
            font-weight: 600;
            line-height: 1.8;

            text-align: center;
        }

        .submit-button {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                var(--primary),
                var(--primary-dark)
            );

            color: #FFFFFF;

            font-family: 'Tajawal', sans-serif;
            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            box-shadow: 0 8px 18px rgba(90, 70, 220, 0.24);

            transition: 0.2s ease;
        }

        .submit-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 11px 22px rgba(90, 70, 220, 0.30);
        }

        .back-link {
            display: block;
            margin-top: 20px;

            color: var(--primary-dark);
            text-decoration: none;

            text-align: center;

            font-size: 13px;
            font-weight: 700;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 25px 20px;
                border-radius: 18px;
            }

            .brand-name {
                font-size: 27px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <main class="page-container">

        <div class="brand">
            <h2 class="brand-name">EnerTrack</h2>
            <p class="brand-subtitle">نظام مراقبة الطاقة</p>
        </div>

        <section class="card">

            <div class="icon" aria-hidden="true">
                🔒
            </div>

            <h1>إعادة تعيين كلمة المرور</h1>

            {% if valid_link %}

                <p class="description">
                    أدخل كلمة المرور الجديدة لحسابك.
                </p>

                <form method="POST">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="submit-button">
                        حفظ كلمة المرور الجديدة
                    </button>
                </form>

                <a href="{% url 'login' %}" class="back-link">
                    العودة إلى تسجيل الدخول
                </a>

            {% else %}

                <p class="invalid-message">
                    هذا الرابط غير صالح أو منتهي الصلاحية.
                </p>

                <a href="{% url 'forgot_password' %}" class="back-link">
                    اطلب رابطًا جديدًا
                </a>

            {% endif %}

        </section>

    </main>

</body>
</html>
