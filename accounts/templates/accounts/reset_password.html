<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إعادة تعيين كلمة المرور</title>
</head>
<body>
    <h2>إعادة تعيين كلمة المرور</h2>

    {% if valid_link %}
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">حفظ كلمة المرور الجديدة</button>
        </form>
    {% else %}
        <p style="color:red">هذا الرابط غير صالح أو منتهي الصلاحية.</p>
        <p><a href="{% url 'forgot_password' %}">اطلب رابطًا جديدًا</a></p>
    {% endif %}
</body>
</html>
