<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نسيت كلمة المرور</title>
</head>
<body>
    <h2>استعادة كلمة المرور</h2>

    {% if sent %}
        <p style="color:green">تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني (هذه رسالة تجريبية مؤقتة).</p>
    {% else %}
        <p>أدخل بريدك الإلكتروني وسنرسل لك رابطًا لإعادة تعيين كلمة المرور.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">إرسال</button>
        </form>
    {% endif %}

    <p><a href="{% url 'login' %}">العودة إلى تسجيل الدخول</a></p>
</body>
</html>
